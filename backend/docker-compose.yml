services:
  postgres:
    image: postgres:16-alpine
    container_name: labtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labtracker}
      POSTGRES_USER: ${POSTGRES_USER:-labtracker_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword_change_me}
    ports:
      - "5432:5432"
    volumes:
      - labtracker_pg_data:/var/lib/postgresql/data

  minio:
    # MinIO no longer publishes images to quay.io or Docker Hub; Chainguard
    # builds the same server from source.
    image: cgr.dev/chainguard/minio:latest
    container_name: labtracker-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-labtracker}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devpassword_change_me}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - labtracker_minio_data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: labtracker-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@labtracker.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-devpassword_change_me}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  labtracker_pg_data:
  labtracker_minio_data:
