# Keep the original scheme when TLS ends at a load balancer in front of this.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Equipment image uploads are capped at 5 MB by the API.
    client_max_body_size 6m;
    server_tokens off;

    # Requests through the Cloudflare Tunnel all arrive from cloudflared, so
    # take the visitor's address from CF-Connecting-IP, but only for requests
    # from cloudflared's fixed address (docker-compose.prod.yml). Never the
    # whole tunnel subnet: its gateway also forwards LAN traffic to the
    # published port. $remote_addr is then the visitor, which X-Forwarded-For
    # passes on to the API's rate limiter.
    set_real_ip_from 10.213.47.10;
    real_ip_header CF-Connecting-IP;

    # Docker's DNS. Upstreams are set through variables so a recreated
    # container's new IP is picked up instead of cached until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    set $storage_upstream http://storage:3902;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /health {
        proxy_pass $api_upstream;
        # Otherwise nginx sends Host: api:8080, which AllowedHosts rejects.
        proxy_set_header Host $host;
    }

    # Equipment photos (the API's Minio:PublicBaseUrl is /storage), read-only
    # from Garage's web endpoint, which picks the bucket from the Host header.
    # Keys are random UUIDs, so they can be cached for a long time.
    location /storage/labtracker-equipment/equipment/ {
        limit_except GET { deny all; }
        rewrite ^/storage/labtracker-equipment/(.*)$ /$1 break;
        proxy_pass $storage_upstream;
        proxy_set_header Host labtracker-equipment;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        # add_header here replaces the server-level ones, so repeat nosniff.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
