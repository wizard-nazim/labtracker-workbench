# Included at server level and in every location that sets its own add_header
# (which otherwise drops the inherited ones).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Report-only for now: the browser console shows what would be blocked, but
# nothing is. Switch the header name to Content-Security-Policy once a week of
# normal use shows no reports (docs/deploy-homelab.md). Styles allow inline
# because Radix, sonner and a few components inject <style>; scripts don't,
# which is what protects the sign-in token in localStorage.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
