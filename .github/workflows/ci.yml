name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LabTracker.slnx
      - run: dotnet build LabTracker.slnx --no-restore -c Release
      # Integration tests start Postgres via Testcontainers (Docker is on the runner).
      - run: dotnet test LabTracker.slnx --no-build -c Release
      - name: Fail if the model has changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/LabTracker.Infrastructure -s src/LabTracker.Api --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t labtracker-api backend
      - run: docker build -t labtracker-web frontend
