# Production stack: the API plus nginx serving the frontend and proxying /api.
# Postgres and S3-compatible storage are external (e.g. Supabase / S3 / MinIO).
#
#   cp .env.production.example .env.production   # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?set DATABASE_CONNECTION_STRING}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Minio__ServiceUrl: ${S3_SERVICE_URL:-}
      Minio__AccessKey: ${S3_ACCESS_KEY:-}
      Minio__SecretKey: ${S3_SECRET_KEY:-}
      Minio__Bucket: ${S3_BUCKET:-labtracker-equipment}
      Minio__PublicBaseUrl: ${S3_PUBLIC_BASE_URL:-}
    # No published port: only reachable through the web container.
    expose:
      - "8080"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
